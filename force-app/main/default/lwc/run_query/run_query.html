    <lightning-card title="Dynamic Table">
        <div class="slds-m-around_medium">
            <template if:true={tableDataProcessed}>
                <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                    <thead>
                        <tr>
                            <template for:each={columns} for:item="label">
                                <th key={label} scope="col">{label}</th>
                            </template>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={tableDataProcessed} for:item="row">
                            <tr key={row.id}>
                                <template for:each={row.values} for:item="value">
                                    <td key={value}>{value}</td>
                                </template>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>
            <template if:false={tableDataProcessed}>
                <p>No data available</p>
            </template>
        </div>
    </lightning-card>



</template>
